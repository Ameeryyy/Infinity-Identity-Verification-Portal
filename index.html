<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Identity - Verification Node Boot</title>
    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --c-blue: #007bff;
            --c-green: #00C851;
            --c-red: #ff4444;
            --c-yellow: #ffbb33;
            --dim-blue: rgba(0, 123, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg) !important;
            color: var(--fg) !important;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .coin-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .coin-outer {
            width: 110px;
            height: 110px;
            position: relative;
            transform-style: preserve-3d;
            animation: coinFlip 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            border-radius: 50%;
            border: 2px solid var(--c-blue);
            box-shadow: 0 0 25px var(--c-blue), inset 0 0 15px var(--dim-blue);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coin-inner-ring {
            width: 80px;
            height: 80px;
            border: 2px dashed rgba(0, 123, 255, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinRing 6s linear infinite;
        }

        .coin-core {
            width: 36px;
            height: 36px;
            background-color: var(--c-blue);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--c-blue);
            animation: pulseCore 1.5s ease-in-out infinite alternate;
        }

        .title-group {
            text-align: center;
            z-index: 10;
        }

        .main-title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 0 0 15px 0;
            color: var(--fg);
            animation: fadeIn 1s ease-out;
        }

        .sub-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 8px;
            color: var(--c-blue);
            margin: 0 0 50px 0;
            animation: fadeIn 1.5s ease-out;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeIn 2s ease-out;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--c-blue);
            border-radius: 50%;
            animation: blink 1s infinite alternate;
        }

        .status-text {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--fg);
            opacity: 0.8;
            display: flex;
            align-items: center;
        }

        .theme-warning {
            position: absolute;
            bottom: clamp(10px, 3vmin, 20px);
            font-size: clamp(10px, 1.5vmin, 12px);
            text-align: center;
            width: 90%;
            max-width: 450px;
            opacity: 0.9;
            transition: color 0.5s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .wave-dots span {
            display: inline-block;
            animation: wave 1.2s infinite ease-in-out;
        }
        .wave-dots span:nth-child(1) { animation-delay: 0s; }
        .wave-dots span:nth-child(2) { animation-delay: 0.2s; }
        .wave-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes coinFlip {
            0% { transform: rotateY(0deg) rotateX(10deg); }
            50% { transform: rotateY(180deg) rotateX(-10deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        @keyframes spinRing {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        @keyframes pulseCore {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes blink {
            0% { opacity: 0.2; box-shadow: none; }
            100% { opacity: 1; box-shadow: 0 0 15px var(--c-blue); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @media (max-width: 768px) {
            .main-title { font-size: 24px; letter-spacing: 6px; }
            .sub-title { font-size: 11px; letter-spacing: 4px; }
            .coin-wrapper { width: 95px; height: 95px; margin-bottom: 35px; }
            .coin-outer { width: 85px; height: 85px; }
            .coin-inner-ring { width: 60px; height: 60px; }
            .coin-core { width: 26px; height: 26px; }
            .status-text { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="coin-wrapper">
        <div class="coin-outer">
            <div class="coin-inner-ring">
                <div class="coin-core"></div>
            </div>
        </div>
    </div>

    <div class="title-group">
        <h1 class="main-title">Infinity Identity</h1>
        <h2 class="sub-title">VERIFICATION PORTAL</h2>
    </div>

    <div class="status-bar">
        <div class="status-dot"></div>
        <div class="status-text" id="statusMessage">
            INITIALIZING SECURE NODE<span class="wave-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>

    <script src="brain.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.opacity = '1'; }, 100);
            
            const isLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            const w = document.createElement("div");
            w.className = "theme-warning";
            const waveDots = '<span class="wave-dots"><span>.</span><span>.</span><span>.</span></span>';
            const netStatus = navigator.onLine 
                ? ' | <span style="color: var(--c-green); font-weight: bold;">ONLINE</span>' 
                : ' | <span style="color: var(--c-red); font-weight: bold;">OFFLINE</span>';
            
            if (isLight) {
                w.style.color = "var(--c-yellow)";
                w.innerHTML = `Please switch to Dark Theme${waveDots}${netStatus}`;
            } else {
                w.style.color = "var(--c-green)";
                w.innerHTML = `Dark Theme Activated${waveDots}${netStatus}`;
            }
            document.body.appendChild(w);

            const loadTime = Math.floor(Math.random() * 2000) + 3000; 
            
            setTimeout(() => {
                const statusEl = document.getElementById('statusMessage');
                const dot = document.querySelector('.status-dot');
                dot.style.backgroundColor = 'var(--c-green)';
                dot.style.boxShadow = '0 0 15px var(--c-green)';
                statusEl.innerHTML = '<span style="color: var(--c-green);">CONNECTION ESTABLISHED ✔</span>';
                
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    setTimeout(() => {
                        if (navigator.onLine) {
                            window.location.href = 'home.html';
                        } else {
                            window.location.href = 'offline.html';
                        }
                    }, 1000);
                }, 1000);

            }, loadTime - 1500);
        });
    </script>
</body>
</html>
