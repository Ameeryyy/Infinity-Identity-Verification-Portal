<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity - Final Verification</title>
    <style>
        :root { --bg: #000000; --fg: #ffffff; --c-blue: #007bff; --c-red: #ff4444; --c-green: #00C851; --c-yellow: #ffbb33; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-blue); }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg) !important; 
            color: var(--fg) !important; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow-x: hidden; 
            opacity: 0; transition: opacity 1s ease-in-out; padding-bottom: 50px;
        }

        .top-left { position: fixed; top: clamp(15px, 4vw, 30px); left: clamp(15px, 4vw, 30px); cursor: pointer; opacity: 0.6; transition: 0.3s; color: inherit; display: flex; align-items: center; justify-content: center; text-decoration: none; z-index: 100; }
        .top-left:hover { opacity: 1; color: var(--c-blue); }
        .top-left span { font-weight: 900; letter-spacing: 2px; font-size: 13px; }

        .shield-icon { width: 100px; height: 100px; margin: 40px auto 20px auto; fill: var(--c-green); filter: drop-shadow(0 0 15px rgba(0, 200, 81, 0.4)); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 200, 81, 0.4)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(0, 200, 81, 0.8)); } 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 200, 81, 0.4)); } }

        .master-wrapper { width: 90%; max-width: 650px; animation: fadeIn 0.6s ease; text-align: center; margin-top: 50px;}
        
        .brand-title { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; margin-bottom: 8px; text-align: center; }
        h1 { font-weight: bold; margin-top: 0; margin-bottom: 30px; font-size: clamp(22px, 6vw, 32px); text-transform: uppercase; letter-spacing: 1px; color: var(--c-green); }

        /* Modified Info Card styling to match the Edit page review card design */
        .review-card { border: 1px solid var(--c-green); border-radius: 16px; background: rgba(128,128,128,0.01); backdrop-filter: blur(10px); padding: 25px; margin-bottom: 25px; width: 100%; box-sizing: border-box; text-align: left; box-shadow: 0 5px 20px rgba(0, 200, 81, 0.05); }
        .step-tag { font-size: 9px; font-weight: bold; color: var(--c-green); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; display: block; opacity: 0.8; }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .review-title { font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 10px; color: var(--c-green); }
        .review-title svg { width: 18px; height: 18px; fill: var(--c-green); }
        
        .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; border-top: 1px dashed rgba(128,128,128,0.2); margin-top: 15px; padding-top: 15px; }
        .data-item { display: flex; flex-direction: column; gap: 4px; }
        .data-label { font-size: 10px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; color: var(--fg); }
        .data-value { font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; word-break: break-word; color: var(--fg); }

        .summary-grid { display: grid; grid-template-columns: 1fr; gap: 15px; text-align: left; background: rgba(128,128,128,0.02); padding: 25px; border-radius: 16px; border: 1px solid rgba(128,128,128,0.2); margin-bottom: 30px; backdrop-filter: blur(10px); }
        .s-item { display: flex; flex-direction: row; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(128,128,128,0.2); padding-bottom: 15px; margin-bottom: 5px; }
        .s-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        .s-label { font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .s-value { font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: var(--c-green); background: rgba(0, 200, 81, 0.1); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(0, 200, 81, 0.3); }

        .payment-box { border: 1px solid var(--c-blue); background: rgba(0, 123, 255, 0.05); padding: 25px; border-radius: 16px; margin-bottom: 25px; text-align: center; }
        .payment-amount { font-size: 36px; font-weight: bold; color: var(--c-blue); margin-bottom: 10px; letter-spacing: 2px; }
        .payment-desc { font-size: 12px; opacity: 0.8; line-height: 1.5; text-transform: uppercase; letter-spacing: 1px; }

        .btn-group { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .btn-action { flex: 1; padding: 16px; min-width: 200px; background: transparent; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.4s ease; text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center; }
        .btn-cancel { border: 1px solid var(--c-red); color: var(--c-red); }
        .btn-cancel:hover { background: var(--c-red); color: #000; box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3); }
        .btn-pay { border: 1px solid var(--c-green); color: var(--c-green); }
        .btn-pay:hover:not(.processing):not(.saved) { background: var(--c-green); color: #000; box-shadow: 0 5px 15px rgba(0, 200, 81, 0.3); }
        
        .btn-pay.processing { opacity: 1 !important; pointer-events: none; background: var(--c-yellow) !important; border-color: var(--c-yellow) !important; color: #000 !important; box-shadow: 0 5px 15px rgba(255, 187, 51, 0.3); }
        .btn-pay.saved { opacity: 1 !important; pointer-events: none !important; background: var(--c-green) !important; border-color: var(--c-green) !important; color: #000 !important; box-shadow: none !important; }

        .wave-dots { display: inline-block; margin-left: 2px; }
        .wave-dots span { display: inline-block; animation: wave 1.2s infinite ease-in-out; }
        .wave-dots span:nth-child(1) { animation-delay: 0s; }
        .wave-dots span:nth-child(2) { animation-delay: 0.2s; }
        .wave-dots span:nth-child(3) { animation-delay: 0.4s; }

        .info-carousel { font-size: clamp(11px, 2.5vw, 13px); opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; transition: opacity 0.5s ease-in-out; pointer-events: none; height: 20px; margin-top: 25px; text-align: center; width: 100%; display: flex; align-items: center; justify-content: center; }
        .spinner-inline { display: inline-block; width: 12px; height: 12px; border: 2px solid transparent; border-top-color: var(--c-cyan); border-right-color: var(--c-cyan); border-radius: 50%; animation: spin 1s linear infinite; margin-left: 8px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .master-wrapper { margin-top: 20px; width: 92%; }
            .shield-icon { margin-top: 40px; width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <div class="top-left" onclick="cancelRegistration()">
        <span>BACK</span>
    </div>

    <div class="master-wrapper">
        <svg class="shield-icon" viewBox="0 0 24 24">
            <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M10,17L5,12L6.41,10.59L10,14.17L17.59,6.58L19,8L10,17Z"/>
        </svg>
        
        <div class="brand-title">INFINITY IDENTITY</div>
        <h1><strong>FINAL VERIFICATION</strong></h1>
        
        <div id="targetInfoContainer" style="width: 100%;"></div>

        <div class="summary-grid" id="summaryGrid"></div>

        <div class="payment-box">
            <div class="payment-amount">₹75.00</div>
            <div class="payment-desc">Identity Verification Node Processing Fee.<br>Decentralized Ledger Synchronization.</div>
        </div>

        <div class="btn-group">
            <button class="btn-action btn-cancel" onclick="cancelRegistration()">GO BACK / EDIT</button>
            <button class="btn-action btn-pay" id="btnPay" onclick="processPayment()">PAY & VERIFY ✔</button>
        </div>

        <div id="infoCarousel" class="info-carousel">System Architecture Integrity: Verified<div class="spinner-inline"></div></div>
    </div>

    <script src="brain.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.opacity = '1'; }, 100);
            loadSummary();
        });

        function loadSummary() {
            let s = {};
            try {
                s = JSON.parse(localStorage.getItem('inf_settings')) || {};
            } catch(e) {}

            let tName = s.verificationTargetName || "UNKNOWN";
            let tPhoneFull = s.verificationTargetPhone || "UNKNOWN";
            let tPhoneMasked = tPhoneFull.length >= 4 ? "**** **** " + tPhoneFull.slice(-4) : tPhoneFull;
            let tCountryCode = s.verificationTargetCountryCode || "+91"; 
            let tCountry = s.verificationTargetCountry || "INDIA";
            let tDob = s.verificationTargetDOB || "NOT PROVIDED";

            let targetHtml = `
                <div class="review-card">
                    <span class="step-tag">TARGET IDENTITY RECORD</span>
                    <div class="review-header">
                        <div class="review-title">
                            <svg viewBox="0 0 24 24"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg>
                            Target Profile Details
                        </div>
                    </div>
                    <div class="data-grid">
                        <div class="data-item"><span class="data-label">Full Name</span><span class="data-value">${tName}</span></div>
                        <div class="data-item"><span class="data-label">Date of Birth</span><span class="data-value">${tDob}</span></div>
                        <div class="data-item"><span class="data-label">Phone Number</span><span class="data-value">${tPhoneMasked}</span></div>
                        <div class="data-item"><span class="data-label">Country Code</span><span class="data-value">${tCountryCode}</span></div>
                        <div class="data-item"><span class="data-label">Phone Country</span><span class="data-value">${tCountry}</span></div>
                    </div>
                </div>
            `;
            document.getElementById('targetInfoContainer').innerHTML = targetHtml;

            const summaryData = [
                { label: "Facial Verification", value: "VERIFIED ✔" },
                { label: "Fingerprint Verification", value: "VERIFIED ✔" },
                { label: "Thumb Verification", value: "VERIFIED ✔" },
                { label: "Iris Verification", value: "VERIFIED ✔" },
                { label: "Digital Signature", value: "REGISTERED ✔" }
            ];

            const grid = document.getElementById('summaryGrid');
            let htmlStr = '';

            summaryData.forEach(item => {
                htmlStr += `
                    <div class="s-item">
                        <span class="s-label">${item.label}</span>
                        <span class="s-value">${item.value}</span>
                    </div>
                `;
            });

            grid.innerHTML = htmlStr;
        }

        function processPayment() {
            const btnPay = document.getElementById('btnPay');
            
            btnPay.classList.add('processing');
            btnPay.innerHTML = 'PROCESSING GATEWAY CLEARANCE<span class="wave-dots"><span>.</span><span>.</span><span>.</span></span>';
            btnPay.disabled = true;

            setTimeout(() => {
                btnPay.classList.remove('processing');
                btnPay.classList.add('saved');
                btnPay.innerHTML = 'CLEARANCE SUCCESS ✔';
                
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    setTimeout(() => { 
                        window.location.href = 'saving.html'; 
                    }, 1000);
                }, 1000);
            }, 2500);
        }

        function cancelRegistration() {
            document.body.style.opacity = '0';
            setTimeout(() => { 
                window.location.href = 'edit.html'; 
            }, 1000);
        }

        const archInfo = [
            "System Architecture Integrity: Verified",
            "Establishing Secure Cryptographic Tunnels",
            "End-to-End AES-GCM Encryption Active",
            "Synchronizing Decentralized Nodes",
            "Zero-Knowledge Proofs Validated",
            "Protecting Digital Footprint...",
            "Private Data Exclusively Controlled",
            "Monitoring Network Latency",
            "Awaiting User Authorization",
            "Quantum-Resistant Protocols Engaged"
        ];
        let infoIndex = 0;
        setInterval(() => {
            const el = document.getElementById('infoCarousel');
            if(el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    infoIndex = (infoIndex + 1) % archInfo.length;
                    el.innerHTML = archInfo[infoIndex] + '<div class="spinner-inline"></div>';
                    el.style.opacity = '0.6';
                }, 500);
            }
        }, 3000);
    </script>
</body>
</html>
