<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Identity - Data Anchoring</title>
    <style>
        :root { 
            --bg: #030305; 
            --fg: #ffffff; 
            --c-blue: #007bff; 
            --c-red: #ff4444; 
            --c-green: #00C851; 
            --c-yellow: #ffbb33; 
            --dim: rgba(0, 123, 255, 0.15); 
        }
        
        body { 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background-color: var(--bg) !important; 
            color: var(--fg) !important; 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            overflow: hidden; 
            position: relative;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        @keyframes blinkText { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .auth-panel { border: 1px solid var(--dim); padding: 45px 40px; width: 340px; position: relative; background: rgba(0, 123, 255, 0.03); backdrop-filter: blur(20px); border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 10; text-align: center; }

        .auth-header h2 { margin: 0; font-size: 20px; letter-spacing: 6px; text-transform: uppercase; font-weight: 800; color: var(--fg); }
        .auth-header p { margin: 8px 0 25px; font-size: 10px; letter-spacing: 3px; opacity: 0.6; text-transform: uppercase; color: var(--c-blue); font-weight: bold; }

        .percentage-display { font-size: 48px; font-weight: 800; letter-spacing: 5px; margin-bottom: 25px; color: var(--c-blue); text-shadow: 0 0 20px rgba(0, 123, 255, 0.3); }
        
        .progress-container { width: 100%; height: 6px; background: rgba(0, 123, 255, 0.1); margin-bottom: 30px; position: relative; overflow: hidden; border-radius: 6px; }
        .progress-bar { height: 100%; width: 0%; background: var(--c-blue); box-shadow: 0 0 15px var(--c-blue); transition: width 0.1s linear; border-radius: 6px; }

        .checklist { text-align: left; font-size: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 25px; line-height: 1.8; }
        .check-item { display: flex; justify-content: space-between; opacity: 0.4; transition: 0.3s; margin-bottom: 8px; color: var(--fg); }
        .check-item.active { opacity: 1; color: var(--c-blue); }
        .check-item.done { opacity: 1; color: var(--c-green); }
        .check-item.done::after { content: '[ SECURED ]'; }
        .check-item.active::after { content: '[ SYNCING ]'; animation: blinkText 1s infinite; }
        .check-item.pending::after { content: '[ WAITING ]'; }

        .status-text { font-size: 11px; font-weight: bold; letter-spacing: 2px; min-height: 20px; text-transform: uppercase; color: var(--fg); }
        
        .success-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.5s; z-index: 20; }
        .success-overlay.show { opacity: 1; pointer-events: auto; }
        .success-title { font-size: 28px; font-weight: 800; letter-spacing: 8px; margin-bottom: 10px; color: var(--c-green); text-shadow: 0 0 20px rgba(0, 200, 81, 0.4); }
        .success-sub { font-size: 11px; font-weight: bold; letter-spacing: 4px; color: var(--fg); opacity: 0.8; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="auth-panel">
        <div class="auth-header">
            <h2>Secure Vault</h2>
            <p>Syncing To Cloud Ledger</p>
        </div>

        <div class="percentage-display" id="percentText">0%</div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="checklist" id="checklist">
            <div class="check-item pending" id="chk-data"><span>Data accepting</span></div>
            <div class="check-item pending" id="chk-face"><span>Facial biometric scan</span></div>
            <div class="check-item pending" id="chk-lfingers"><span>Left Four fingers biometric scan</span></div>
            <div class="check-item pending" id="chk-rfingers"><span>Right Four fingers biometric scan</span></div>
            <div class="check-item pending" id="chk-thumbs"><span>Dual thumbs biometric scan</span></div>
            <div class="check-item pending" id="chk-iris"><span>Dual iris scan</span></div>
            <div class="check-item pending" id="chk-sig"><span>Digital signature</span></div>
        </div>

        <div class="status-text" id="statusMsg">INITIALIZING CLOUD UPLINK...</div>
        
        <div class="success-overlay" id="successScreen">
            <div class="success-title">ANCHORED</div>
            <div class="success-sub">ALL DATA SECURED IN CLOUD</div>
        </div>
    </div>

    <script src="brain.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.opacity = '1'; }, 100);
        });

        const percentText = document.getElementById('percentText');
        const progressBar = document.getElementById('progressBar');
        const statusMsg = document.getElementById('statusMsg');
        const successScreen = document.getElementById('successScreen');
        
        let progress = 0;
        
        // 7 Steps matching the new checklist
        const phases = [
            { threshold: 14, id: 'chk-data', msg: 'SYNCING BASE DATA...' },
            { threshold: 28, id: 'chk-face', msg: 'ENCRYPTING FACIAL BIOMETRIC...' },
            { threshold: 42, id: 'chk-lfingers', msg: 'UPLOADING LEFT FINGERS...' },
            { threshold: 56, id: 'chk-rfingers', msg: 'UPLOADING RIGHT FINGERS...' },
            { threshold: 70, id: 'chk-thumbs', msg: 'SECURING DUAL THUMBS...' },
            { threshold: 84, id: 'chk-iris', msg: 'ENCRYPTING DUAL IRIS...' },
            { threshold: 95, id: 'chk-sig', msg: 'VERIFYING DIGITAL SIGNATURE...' }
        ];

        let currentPhase = 0;

        function setItemState(id, state) {
            const el = document.getElementById(id);
            if(el) {
                el.className = `check-item ${state}`;
            }
        }

        const interval = setInterval(() => {
            progress += Math.random() * 1.5; 
            if(progress >= 100) progress = 100;
            
            percentText.innerText = Math.floor(progress) + '%';
            progressBar.style.width = progress + '%';

            if(currentPhase < phases.length && progress >= phases[currentPhase].threshold) {
                if(currentPhase > 0) {
                    setItemState(phases[currentPhase - 1].id, 'done');
                }
                setItemState(phases[currentPhase].id, 'active');
                statusMsg.innerText = phases[currentPhase].msg;
                currentPhase++;
            }

            if(progress === 100) {
                clearInterval(interval);
                setItemState(phases[phases.length - 1].id, 'done');
                statusMsg.innerText = 'CLOUD SYNC COMPLETE.';
                
                setTimeout(() => {
                    successScreen.classList.add('show');
                    setTimeout(() => {
                        window.location.href = 'robot.html';
                    }, 1500);
                }, 800);
            }
        }, 80);
    </script>
</body>
</html>
